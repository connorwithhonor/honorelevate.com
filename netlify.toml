# honorelevate.com - Netlify build config
# Source of truth: this repo. Deploys triggered on push to main.
# Snapshot-API uploads are deprecated — see SITE-REGISTRY.txt + connor-own-sites-git-canonical.md

[build]
  publish = "."

# Serverless functions. Added 2026-07-20 for /va-intake, which POSTs the
# pre-meeting answers into the HonorElevate sub-account. Secrets live in
# Netlify env vars (HE_PIT, HE_LOCATION_ID), never in the repo.
[functions]
  directory = "netlify/functions"

# Disable HTML post-processing so we never inject favicon/meta tags multiple times
# (Previous manual-deploy sessions injected duplicate favicon blocks; auto-deploy from
# git should never modify the source HTML at build time.)
[build.processing]
  skip_processing = true

[build.processing.html]
  pretty_urls = true

# Don't publish project-internal docs even if they get committed
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/README*"
  to = "/404.html"
  status = 404

# Function source lives inside the publish dir (publish = "."), so it would
# otherwise be readable as a static file. No secrets in it, but don't serve it.
# Does not affect the runtime path, which is /.netlify/functions/*.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# Build tooling lives inside the publish dir (publish = "."), so it would
# otherwise be served as static files. No secrets in it, but don't serve it.
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

# Blog duplicate cleanup (2026-09-05). Three posts existed BOTH as /blog/slug.html
# and /blog/slug/index.html with byte-identical content, so each ranked against
# itself. The .html twins were deleted; these 301s preserve any equity those URLs
# earned and point at the directory form, which is what the canonical now declares.
[[redirects]]
  from = "/blog/ai-home-service-companies.html"
  to = "/blog/ai-home-service-companies/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/ai-voice-agents-replacing-hold-music.html"
  to = "/blog/ai-voice-agents-replacing-hold-music/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/real-cost-of-missed-calls.html"
  to = "/blog/real-cost-of-missed-calls/"
  status = 301
  force = true
